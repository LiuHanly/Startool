plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'kotlin-parcelize'
}

android {
    compileSdk 31

    defaultConfig {
        applicationId "com.glorystar.startool"
        minSdk 21
        targetSdk 21
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.10.2'
        }
    }

    buildFeatures {
        viewBinding true
    }

    packagingOptions {
        exclude 'META-INF/library_release.kotlin_module'
    }

}



dependencies {

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.2.0'
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.google.android.material:material:1.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'com.google.android.material:material:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.2.2'
    implementation 'androidx.navigation:navigation-ui-ktx:2.2.2'
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
    /*** 图片加载框架 Glide4.x ***/
    implementation 'com.github.bumptech.glide:glide:4.11.0' // 添加支持
    annotationProcessor 'com.github.bumptech.glide:compiler:4.11.0' // Glide4.x以上需要添加的支持
    implementation 'jp.wasabeef:glide-transformations:4.1.0' // 配套Glide图片加载框架的图片变换开源库
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.3.9'
    // 日志打印 依赖
    implementation 'com.jakewharton.timber:timber:4.7.1'
    // 提示框 和 图片预览 框架。
    implementation 'com.lxj:xpopup:1.8.10'


    implementation 'com.github.lzyzsd:circleprogress:1.2.1'

    implementation 'com.google.code.gson:gson:2.8.5'

    //Logger
    implementation 'com.orhanobut:logger:2.2.0'

    // room 数据库
    implementation "androidx.room:room-runtime:2.1.0"
    kapt "androidx.room:room-compiler:2.1.0"
    implementation 'com.jakewharton:butterknife:10.1.0'

    implementation 'cn.wandersnail:commons-android:1.2.4'
    implementation 'me.jessyan:autosize:1.2.1'

    implementation 'com.github.licheedev.Android-SerialPort-API:serialport:1.0.1'
    // 提示框 和 图片预览 框架。
    implementation 'com.lxj:xpopup:1.8.10'


}